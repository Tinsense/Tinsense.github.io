name: Update Materials Project formation-energy data

on:
  push:
    paths:
      - "scripts/generate_mp_formation.py"
      - ".github/workflows/update-mp-formation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install requests
      - name: Download MP snapshot and generate data
        run: python scripts/generate_mp_formation.py
      - name: Commit generated dataset
        run: |
          if git diff --quiet -- metal-formation-energy/data.js; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metal-formation-energy/data.js
          git commit -m "Update Materials Project formation-energy dataset"
          git push
